name: Mobile Security Hardening Verification

on:
  push:
    branches:
      - security-hardening-v1
  pull_request:
    branches:
      - security-hardening-v1

permissions:
  contents: read

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript verification
        run: npm run typecheck

      - name: Expo project health verification
        run: npm run doctor

      - name: Deterministic release integrity verification
        run: npm run verify:release

      - name: Release-path integrity verification
        shell: bash
        run: |
          set -euo pipefail

          # Scope release-path checks to executable app/config files. Historical
          # audit notes and generated evidence files must not create false positives.
          if git grep -n -E 'injustice-production\.up\.railway\.app|EXPO_PUBLIC_API_URL|RAILWAY|supabaseClient' -- \
            mobile/App.tsx \
            mobile/app.config.ts \
            mobile/eas.json \
            mobile/package.json \
            mobile/src; then
            echo 'Forbidden legacy backend/config reference detected.'
            exit 1
          fi

          if [ -e .env ]; then
            echo 'mobile/.env must not exist in the release branch.'
            exit 1
          fi

          test -f .env.example
          test ! -e src/services/supabaseClient.ts
          test ! -e src/services/api.ts
          test ! -e app.json

      - name: Supabase project reachability check
        shell: bash
        run: |
          set -euo pipefail

          project_ref='prwcbruqvywakcvoknai'
          url="https://${project_ref}.supabase.co/auth/v1/health"
          status="$(curl -sS -o /tmp/supabase-health.txt -w '%{http_code}' --connect-timeout 10 --max-time 20 "$url")"

          echo "Supabase health HTTP status: ${status}"

          if [ "$status" = "540" ]; then
            echo 'Supabase project is paused.'
            exit 1
          fi

          case "$status" in
            2??)
              echo 'Supabase Auth health endpoint responded successfully.'
              ;;
            4??|5??)
              echo 'Supabase project endpoint responded, but the service did not return a successful health response.'
              cat /tmp/supabase-health.txt
              exit 1
              ;;
            *)
              echo 'Unexpected Supabase health response.'
              cat /tmp/supabase-health.txt
              exit 1
              ;;
          esac

      - name: Expo config inspection
        run: npx expo config --json > /tmp/expo-config.json && node -e "const c=require('/tmp/expo-config.json'); if(JSON.stringify(c).includes('injustice-production.up.railway.app')) process.exit(1)"
