name: Mobile Security Hardening Verification

on:
  push:
    branches:
      - security-hardening-v1
  pull_request:
    branches:
      - security-hardening-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-mobile:
    runs-on: [self-hosted, windows, x64]
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript verification
        run: npm run typecheck

      - name: Expo project health verification
        run: npm run doctor

      - name: Deterministic release integrity verification
        run: npm run verify:release

      - name: High-severity dependency audit
        run: npm audit --audit-level=high

      - name: Static security regression suite
        run: npm run test:security

      - name: Release-path integrity verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Scope release-path checks to executable app/config files. Historical
          # audit notes and generated evidence files must not create false positives.
          git grep -n -E 'injustice-production\.up\.railway\.app|EXPO_PUBLIC_API_URL|RAILWAY|supabaseClient' -- mobile/App.tsx mobile/app.config.ts mobile/eas.json mobile/package.json mobile/src
          if ($LASTEXITCODE -eq 0) {
            Write-Error 'Forbidden legacy backend/config reference detected.'
          }
          elseif ($LASTEXITCODE -ne 1) {
            Write-Error "git grep failed with exit code $LASTEXITCODE."
          }

          if (Test-Path .env) {
            Write-Error 'mobile/.env must not exist in the release branch.'
          }

          if (-not (Test-Path .env.example)) { Write-Error '.env.example is missing.' }
          if (Test-Path src/services/supabaseClient.ts) { Write-Error 'Legacy supabaseClient.ts must not exist.' }
          if (Test-Path src/services/api.ts) { Write-Error 'Legacy api.ts must not exist.' }
          if (Test-Path app.json) { Write-Error 'Duplicate app.json must not exist.' }

      - name: Supabase project reachability check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $projectRef = 'prwcbruqvywakcvoknai'
          $url = "https://$projectRef.supabase.co/auth/v1/health"
          $bodyFile = Join-Path $env:TEMP 'supabase-health.txt'

          $status = & curl.exe -sS -o $bodyFile -w '%{http_code}' --connect-timeout 10 --max-time 20 $url
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Supabase health request failed with curl exit code $LASTEXITCODE."
          }

          Write-Host "Supabase health HTTP status: $status"

          if ($status -eq '540') {
            Write-Error 'Supabase project is paused.'
          }

          if ($status -match '^2') {
            Write-Host 'Supabase Auth health endpoint responded successfully.'
          }
          elseif ($status -match '^[45]') {
            Write-Host 'Supabase project endpoint responded, but the service did not return a successful health response.'
            Get-Content $bodyFile
            Write-Error 'Supabase health check failed.'
          }
          else {
            Get-Content $bodyFile
            Write-Error 'Unexpected Supabase health response.'
          }

      - name: Expo config inspection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expoConfig = Join-Path $env:TEMP 'expo-config.json'
          npx expo config --json | Out-File -FilePath $expoConfig -Encoding utf8
          $config = Get-Content $expoConfig -Raw
          if ($config.Contains('injustice-production.up.railway.app')) {
            Write-Error 'Legacy Railway URL detected in Expo config.'
          }
