name: Mobile verification

on:
  push:
    branches:
      - sdk57-upgrade
  pull_request:
    branches:
      - sdk57-upgrade
      - main

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: E2E contract check
        run: npm run test:e2e-contract
