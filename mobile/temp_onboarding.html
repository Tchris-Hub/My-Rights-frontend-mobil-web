<!DOCTYPE html>

<style>
        body { font-family: 'Inter', sans-serif; background-color: #0b1326; }
        .plusJakartaSans { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(34, 42, 61, 0.7);
            backdrop-filter: blur(24px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface antialiased overflow-hidden">
<!-- Top Navigation / Skip Action -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-8 py-6">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="gavel">gavel</span>
<span class="plusJakartaSans font-extrabold tracking-tighter text-primary text-xl">My Rights</span>
</div>
<button class="text-on-surface-variant hover:text-primary font-medium transition-colors duration-200">
            Skip
        </button>
</header>
<!-- Main Onboarding Canvas -->
<main class="relative min-h-screen flex flex-col justify-end">
<!-- Hero Illustration Layer -->
<div class="absolute inset-0 z-0">
<div class="absolute inset-0 bg-gradient-to-b from-surface/20 via-surface/60 to-surface z-10"></div>
<img alt="Authority Iconography" class="w-full h-full object-cover grayscale opacity-40 mix-blend-luminosity" data-alt="Dignified low angle shot of modern judicial architecture featuring clean concrete lines and a symbolic bronze scale of justice in soft dramatic lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuACUq9cxDs-j3WpM1BUTklDnZnahFFRpnJyKcNYIA-vIbcyVMYvIC4mxWu-jPAzy9XnHWP10F2MPnv19p2c1GLURntMbs06Rq1VWMyKlkhOaZbWNK0i4iQV_4Pn-kFj64wqUdmIrBNwrlqS1slb9uAT6Z4-A65VXu04lF5spZNCiAvi3VpNLnse_CRgJ7c6vojbt0PYcbN0Cing6CrTaQynNOt-fY7fm8iGGFKzVfibGQFIt-NboiOXjG5WX6B5q7DFvBTgFbWg1Uuh"/>
</div>
<!-- Editorial Content Section -->
<div class="relative z-20 px-8 pb-32 md:pb-40 max-w-4xl">
<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-secondary-container/10 border border-secondary-container/20 mb-6">
<span class="material-symbols-outlined text-secondary text-sm" data-icon="verified" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="text-secondary text-xs font-bold tracking-widest uppercase">Editorial Authority</span>
</div>
<h1 class="plusJakartaSans text-5xl md:text-7xl font-bold tracking-tight text-white mb-6 leading-[1.1]">
                Know Your <br/>
<span class="text-primary italic">Rights.</span>
</h1>
<p class="text-on-surface-variant text-lg md:text-xl max-w-xl leading-relaxed font-body">
                Navigate complex legal landscapes with clarity. We provide the editorial authority you need to protect your interests and command your future.
            </p>
</div>
<!-- Sticky Interaction Layer -->
<div class="fixed bottom-0 w-full glass-panel pt-8 pb-10 px-8 z-30">
<div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-8">
<!-- Progress Indicators -->
<div class="flex gap-2">
<div class="w-8 h-1.5 rounded-full bg-primary shadow-[0_0_8px_rgba(89,222,155,0.6)]"></div>
<div class="w-2 h-1.5 rounded-full bg-surface-container-highest"></div>
<div class="w-2 h-1.5 rounded-full bg-surface-container-highest"></div>
</div>
<!-- Primary Action Cluster -->
<div class="flex items-center gap-6 w-full md:w-auto">
<button class="flex-1 md:flex-none px-10 py-4 rounded-xl bg-gradient-to-r from-primary to-primary-container text-on-primary-container font-bold text-lg shadow-lg hover:scale-[1.02] active:scale-95 transition-all duration-200 flex items-center justify-center gap-3">
                        Get Started
                        <span class="material-symbols-outlined font-bold" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</div>
</main>
<!-- Background Atmospheric Element -->
<div class="fixed top-1/4 -right-20 w-[500px] h-[500px] bg-primary/5 blur-[120px] rounded-full pointer-events-none"></div>
<div class="fixed -bottom-20 -left-20 w-[400px] h-[400px] bg-secondary-container/5 blur-[100px] rounded-full pointer-events-none"></div>
